<!DOCTYPE html>
<!-- 临时上线验证页：测完即删，勿作为入口 -->
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>cloudtest</title>
</head>
<body>
<pre id="out">pending</pre>
<script src="js/config.local.js"></script>
<script src="js/cloud-config.js"></script>
<script src="js/cloud-api.js"></script>
<script>
(function () {
  var out = document.getElementById("out");
  var lines = [];
  lines.push("origin=" + location.origin);

  // 1) 云服务：建房间（服务端校验来源域名，github.io 是否放行看这一步）
  function testCloud() {
    var code = "T" + String(Math.floor(Math.random() * 90000) + 10000);
    code = code.slice(0, 6);
    return window.JBXCloud.createRoom({
      roomName: "上线自测",
      ownerName: "tester"
    }).then(function (room) {
      lines.push("cloud=OK code=" + (room && (room.code || room.roomCode || room.inviteCode) || JSON.stringify(room).slice(0, 80)));
    }).catch(function (e) {
      lines.push("cloud=FAIL " + (e && e.message || String(e)).slice(0, 200));
    });
  }

  // 2) 高德 REST：输入提示（Web Key 是否可用）
  function testAmap() {
    var url = "https://restapi.amap.com/v3/assistant/inputtips?keywords=武汉大学&city=武汉&key=" + window.__AMAP_KEY__;
    return fetch(url).then(function (r) { return r.json(); }).then(function (j) {
      lines.push("amap=" + (j.status === "1" ? "OK tips=" + ((j.tips || []).length) : "FAIL " + (j.info || "").slice(0, 80)));
    }).catch(function (e) {
      lines.push("amap=FAIL " + (e && e.message || String(e)).slice(0, 120));
    });
  }

  Promise.all([testCloud(), testAmap()]).then(function () {
    out.textContent = lines.join("\n");
    document.title = "TESTDONE";
  });
  setTimeout(function () { if (document.title !== "TESTDONE") { out.textContent += "\ntimeout"; document.title = "TESTDONE"; } }, 20000);
})();
</script>
</body>
</html>
