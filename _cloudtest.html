<!DOCTYPE html>
<!-- 临时全链路验证页：测完即删，勿作为入口 -->
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>cloudtest</title>
</head>
<body>
<pre id="out">pending</pre>
<script src="js/config.local.js?v=1116b"></script>
<script src="js/cloud-config.js?v=1117a"></script>
<script src="js/cloud-api.js?v=1117a"></script>
<script>
(function () {
  var out = document.getElementById("out");
  var lines = [];
  function p(s) { lines.push(s); out.textContent = lines.join("\n"); }
  var C = window.JBXCloud;

  var code = null;
  C.createRoom({ cityCode: "420100", cityName: "武汉", dest: "光谷广场", meetStart: "2026-11-23T09:30", meetEnd: "2026-11-23T18:00" })
    .then(function (r) {
      code = r.code;
      p("1 createRoom=OK code=" + code);
      return C.joinRoom(code, { name: "张海燕", origin: "武汉大学", originCoord: { lng: 114.36, lat: 30.54 }, mode: "transit", budget: 50, winStart: "09:00", winEnd: "10:00" });
    })
    .then(function (m) {
      p("2 joinRoom=OK id=" + m.id + " name=" + m.name + " lng=" + m.origin_lng);
      return C.joinRoom(code, { name: "张海燕-更新", origin: "武大樱园", originCoord: { lng: 114.36, lat: 30.54 }, mode: "drive", budget: 80 });
    })
    .then(function (m) {
      p("3 joinRoom(update)=OK name=" + m.name + " mode=" + m.mode);
      return C.savePlan(code, { best: { label: "方案A" }, note: "smoke" });
    })
    .then(function (r) {
      p("4 savePlan=OK reused=" + r.reused + " status=" + (r.room && r.room.status));
      return C.getRoom(code);
    })
    .then(function (r) {
      p("5 getRoom=OK members=" + r.members.length + " plan=" + JSON.stringify(r.room.plan).slice(0, 60) + " expired=" + r.expired);
      return C.getEvents(code, 10);
    })
    .then(function (evs) {
      p("6 getEvents=OK count=" + evs.length + " kinds=" + evs.map(function (e) { return e.kind; }).join(","));
      p("ALL PASS");
      document.title = "TESTDONE";
    })
    .catch(function (e) {
      p("FAIL: " + (e && e.message || String(e)));
      document.title = "TESTDONE";
    });
  setTimeout(function () { if (document.title !== "TESTDONE") { p("timeout"); document.title = "TESTDONE"; } }, 25000);
})();
</script>
</body>
</html>
