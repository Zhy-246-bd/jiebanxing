<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>结伴行 · 方案结果</title>
  <link rel="stylesheet" href="css/style.css?v=1115b">
  <link rel="stylesheet" href="css/style1.css?v=1119i">
  <link rel="stylesheet" href="css/result.css?v=1120a">
  <style>
    /* 本页补充：电脑端布局不动，只增强移动端与按钮交互；颜色全部走 CSS 变量 */

    /* 移动端：标题用粗行楷 + 柔和入场动画（仅 transform / opacity） */
    @media (max-width: 768px) {
      body.result-page .header h1 {
        font-weight: 700;
        -webkit-animation: jbxTitleIn .6s ease-out both;
        animation: jbxTitleIn .6s ease-out both;
      }
    }
    @-webkit-keyframes jbxTitleIn {
      from { opacity: 0; -webkit-transform: translateY(-8px); transform: translateY(-8px); }
      to   { opacity: 1; -webkit-transform: translateY(0);    transform: translateY(0); }
    }
    @keyframes jbxTitleIn {
      from { opacity: 0; -webkit-transform: translateY(-8px); transform: translateY(-8px); }
      to   { opacity: 1; -webkit-transform: translateY(0);    transform: translateY(0); }
    }

    /* 开始导航：未选方案时置灰、不可点、无 hover 效果（不写死颜色，用透明度） */
    body.result-page .plan-pick-bar .btn:disabled {
      opacity: .45;
      cursor: not-allowed;
      pointer-events: none;
    }
    /* 可用态：过渡 + 触摸时轻微缩放反馈，只动 transform，不影响布局 */
    body.result-page .plan-pick-bar .btn {
      -webkit-transition: -webkit-transform .12s ease, opacity .2s ease;
      transition: transform .12s ease, opacity .2s ease;
    }
    body.result-page .plan-pick-bar .btn:not(:disabled):active {
      -webkit-transform: scale(.97);
      transform: scale(.97);
    }

    /* 移动端：地图容器与对比表外层不超出屏幕（表格内部仍可横滑） */
    @media (max-width: 768px) {
      body.result-page #mapBox { max-width: 100%; box-sizing: border-box; }
      body.result-page #compareTable { max-width: 100%; overflow: hidden; }
      body.result-page #compareTable .jbx-ct-wrap { -webkit-overflow-scrolling: touch; }
    }

    @media (prefers-reduced-motion: reduce) {
      body.result-page .header h1 { -webkit-animation: none; animation: none; }
      body.result-page .plan-pick-bar .btn { -webkit-transition: none; transition: none; }
    }
  </style>
</head>
<body class="result-page">
  <div class="page">
    <div class="header">
      <p class="eyebrow">Journey Together</p>
      <h1>方案对比</h1>
      <p id="subtitle">加载中…</p>
    </div>

    <!-- 地图区域（张宇桐）：高德 JS API 渲染三方案路线，方案切换标签 + 图例由 js/map-view.js 注入。
         Key 未配置时 map-view.js 会在这里显示配置指引，不影响下方卡片和对比表。 -->
    <div id="mapBox">
      <div id="mapTabs"></div>
      <div id="mapArea"></div>
      <div class="jbx-legend">
        <span><i style="background:var(--jbx-transit,#3182ce)"></i>地铁/公交</span>
        <span><i style="background:var(--jbx-taxi,#dd6b20)"></i>打车</span>
        <span><i style="background:var(--jbx-bike,#38a169)"></i>骑行</span>
        <span><i class="dot" style="background:var(--jbx-start,#3182ce)"></i>起点</span>
        <span><i class="dot" style="background:var(--jbx-meet,#f6c344)"></i>集合点</span>
        <span><i class="dot" style="background:var(--jbx-dest,#e53e3e)"></i>目的地</span>
      </div>
      <div id="mapHint"></div>
    </div>

    <!-- 数据可信度提示（张海燕）：接口降级成本地估算时在这里如实说明，
         全部真实时不打扰。内容由 js/data-hint.js 渲染，不占页面结构。 -->
    <div id="dataHint"></div>

    <div class="scheme-head">
      <h2>可选方案</h2>
      <span>三种走法 · 额外代价越低越优</span>
    </div>

    <div class="scheme-guide">
      <span><b>全部直达</b>各自出发，直接到目的地</span>
      <span><b>全员汇合</b>先到同一集合点，再一起走</span>
      <span><b>部分汇合</b>顺路的人先碰头，再一起走</span>
    </div>

    <p class="scheme-caption">这 3 套方案是算法从大量可行方案中筛选出的优质候选；出行方式由每位成员独立选择，不只是汇合方式。</p>

    <div id="schemeList"></div>

    <!-- 选中方案后的操作条：默认隐藏，选中态由 JS 添加（卡片加 .is-selected 或 aria-selected="true"）后显示 -->
    <div class="plan-pick-bar" id="planPickBar" hidden>
      <p>已选定该方案，开启路线指引</p>
      <button class="btn btn-primary" id="startNavBtn" type="button" disabled>开始导航</button>
    </div>

    <div id="compareTable"></div>

    <!-- 从房间进来的回房间，单机演示的回录入页；由下方脚本按 localStorage 判断 -->
    <button class="btn btn-ghost" id="backBtn">← 返回修改信息</button>
  </div>

  <!-- 配置：config.js 进仓库（线上 GitHub Pages 靠它拿 Key 和代理地址）；
       config.local.js 不进仓库（本地覆盖）。
       新拉代码的人：复制 js/config.example.js 为 js/config.local.js，填入自己的 Key。 -->
  <script src="js/config.js?v=1119k"
          onerror="console.info('%c[结伴行] 未找到 js/config.js，地图不可用。','color:#e67e22')"></script>
  <script src="js/config.local.js?v=1119k"
          onerror="console.info('%c[结伴行] 未找到 js/config.local.js，使用仓库配置（js/config.js）。','color:#8a97a0')"></script>

  <script src="js/formats.js?v=1115b"></script>
  <script>
    // 返回去向：在房间里的回房间页，单机演示的回录入页（单机版已改名 demo.html）
    document.getElementById("backBtn").addEventListener("click", function () {
      var inRoom = false;
      try { inRoom = !!JSON.parse(localStorage.getItem("jbx_room_local") || "null"); } catch (e) { /* 数据坏了当没有 */ }
      location.href = inRoom ? "index1.html" : "demo.html";
    });

    var data = JSON.parse(localStorage.getItem("jbx_result") || "null");
    if (!data) { location.href = "index.html"; }

    var wName = (data.result && data.result.weightsName) ? data.result.weightsName : '';
    document.getElementById("subtitle").textContent =
      data.members.length + " 人同行 · " + (data.city ? data.city + " · " : "") +
      "目的地：" + data.dest + " · 按额外代价从低到高" +
      (wName ? "（发起人设定：" + wName + "偏好）" : "");

    var box = document.getElementById("schemeList");
    data.result.schemes.forEach(function (s, i) {
      var best = i === 0;
      var card = document.createElement("div");
      card.className = "card scheme-card" + (best ? " best" : "");
      var legsHtml = s.legs.map(function (l) {
        var segs = l.segments.map(function (seg) {
          return seg.from + " →" + (seg.to === data.dest ? "目的地" : seg.to) +
            "（" + MODE_LABEL[seg.mode] + " " + seg.durationMin + "分钟 / ¥" + seg.cost + "）";
        }).join("　再　");
        return '<div class="leg"><b>' + l.member + '</b>' +
          (l.isBottleneck ? '<span class="bottleneck-tag">瓶颈成员</span>' : '') +
          (l.overBudget ? '<span class="over-budget">超预算 ¥' + l.overBudgetBy + '</span>' : '') +
          '：' + segs + '</div>';
      }).join("");
      card.innerHTML =
        '<span class="scheme-score">额外代价 ' + s.score + '</span>' +
        '<span class="scheme-rank' + (best ? " best" : "") + '">' + (best ? "★ 推荐" : "备选") + '</span>' +
        '<h2>' + s.name + '</h2>' +
        '<div class="conclusion">' + s.conclusion + '</div>' +
        '<div class="metrics">' +
        '<div class="metric"><b>' + s.metrics.totalTimeMin + '</b><span>总耗时(分)</span></div>' +
        '<div class="metric"><b>¥' + s.metrics.totalCost + '</b><span>总费用</span></div>' +
        '<div class="metric"><b>' + s.metrics.worstTimeMin + '</b><span>最长单人(分)</span></div>' +
        '<div class="metric"><b>' + s.metrics.maxWaitMin + '</b><span>最长等待(分)</span></div>' +
        '</div>' + legsHtml;
      box.appendChild(card);
    });

    /* 选中方案 + 开始导航：本页交互，不改动地图、对比表原有逻辑。
       · 未选方案：planPickBar 隐藏，startNavBtn 置灰禁用、hover 无效果
       · 选中某方案：操作条出现，按钮恢复可用并带柔和触摸反馈
       · 点“开始导航”：把地图切到该方案的路线标签，并滚动到地图区 */
    (function () {
      var bar = document.getElementById("planPickBar");
      var navBtn = document.getElementById("startNavBtn");
      var list = document.getElementById("schemeList");
      if (!bar || !navBtn || !list) { return; }

      var selectedIndex = -1;
      var cards = list.querySelectorAll(".scheme-card");

      function setNavEnabled(enabled) {
        if (enabled) { navBtn.removeAttribute("disabled"); }
        else { navBtn.setAttribute("disabled", "disabled"); }
      }

      // 初始态：未选 → 禁用（HTML 上 disabled 属性已是基线，这里保持一致）
      setNavEnabled(false);

      Array.prototype.forEach.call(cards, function (card, i) {
        card.addEventListener("click", function () {
          Array.prototype.forEach.call(cards, function (c) {
            c.classList.remove("is-selected");
            c.removeAttribute("aria-selected");
          });
          card.classList.add("is-selected");
          card.setAttribute("aria-selected", "true");
          selectedIndex = i;
          bar.hidden = false;
          setNavEnabled(true);
        });
      });

      navBtn.addEventListener("click", function () {
        if (navBtn.disabled || selectedIndex < 0) { return; }
        var tabs = document.querySelectorAll("#mapTabs .jbx-tab");
        if (tabs[selectedIndex]) { tabs[selectedIndex].click(); }
        var mapBox = document.getElementById("mapBox");
        if (mapBox && typeof mapBox.scrollIntoView === "function") {
          mapBox.scrollIntoView({ behavior: "smooth", block: "start" });
        }
      });
    })();
  </script>
  <script src="js/compare-table.js?v=1119i"></script>
  <script src="js/data-hint.js?v=1115b"></script>
  <script src="js/map-view.js?v=1120a"></script>
</body>
</html>
