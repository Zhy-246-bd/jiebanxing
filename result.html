<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>结伴行 · 方案结果</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="page">
    <div class="header">
      <h1>方案对比</h1>
      <p id="subtitle">加载中…</p>
    </div>

    <!-- 地图区域（张宇桐）：高德 JS API 渲染三方案路线，方案切换标签 + 图例由 js/map-view.js 注入。
         Key 未配置时 map-view.js 会在这里显示配置指引，不影响下方卡片和对比表。 -->
    <div id="mapBox">
      <div id="mapTabs"></div>
      <div id="mapArea"></div>
      <div class="jbx-legend">
        <span><i style="background:#3182ce"></i>地铁/公交</span>
        <span><i style="background:#dd6b20"></i>打车</span>
        <span><i style="background:#38a169"></i>骑行</span>
        <span><i class="dot" style="background:#3182ce"></i>起点</span>
        <span><i class="dot" style="background:#f6c344"></i>集合点</span>
        <span><i class="dot" style="background:#e53e3e"></i>目的地</span>
      </div>
      <div id="mapHint"></div>
    </div>

    <div id="schemeList"></div>
    <div id="compareTable"></div>

    <button class="btn btn-ghost" onclick="location.href='index.html'">← 返回修改信息</button>
  </div>

  <!-- 本地 Key（不进仓库）：文件不存在时静默跳过，页面照常跑，只是地图显示配置指引。
       新拉代码的人：复制 js/config.example.js 为 js/config.local.js，填入 __AMAP_JS_KEY__ 与 __AMAP_JS_CODE__。 -->
  <script src="js/config.local.js"
          onerror="console.info('%c[结伴行] 未找到 js/config.local.js，地图不可用。复制 js/config.example.js 为 config.local.js 并填入 JS Key 与安全密钥。','color:#e67e22')"></script>

  <script src="js/formats.js"></script>
  <script>
    var data = JSON.parse(localStorage.getItem("jbx_result") || "null");
    if (!data) { location.href = "index.html"; }

    document.getElementById("subtitle").textContent =
      data.members.length + " 人同行 · " + (data.city ? data.city + " · " : "") +
      "目的地：" + data.dest + " · 按综合得分排序";

    var box = document.getElementById("schemeList");
    data.result.schemes.forEach(function (s, i) {
      var best = i === 0;
      var card = document.createElement("div");
      card.className = "card scheme-card" + (best ? " best" : "");
      var legsHtml = s.legs.map(function (l) {
        var segs = l.segments.map(function (seg) {
          return seg.from + " →" + (seg.to === data.dest ? "目的地" : seg.to) +
            "（" + MODE_LABEL[seg.mode] + " " + seg.durationMin + "分钟 / ¥" + seg.cost + "）";
        }).join("　再　");
        return '<div class="leg"><b>' + l.member + '</b>' +
          (l.isBottleneck ? '<span class="bottleneck-tag">瓶颈成员</span>' : '') +
          '：' + segs + '</div>';
      }).join("");
      card.innerHTML =
        '<span class="scheme-score">综合得分 ' + s.score + '</span>' +
        '<span class="scheme-rank' + (best ? " best" : "") + '">' + (best ? "★ 推荐" : "备选") + '</span>' +
        '<h2>' + s.name + '</h2>' +
        '<div class="conclusion">' + s.conclusion + '</div>' +
        '<div class="metrics">' +
        '<div class="metric"><b>' + s.metrics.totalTimeMin + '</b><span>总耗时(分)</span></div>' +
        '<div class="metric"><b>¥' + s.metrics.totalCost + '</b><span>总费用</span></div>' +
        '<div class="metric"><b>' + s.metrics.worstTimeMin + '</b><span>最长单人(分)</span></div>' +
        '<div class="metric"><b>' + s.metrics.maxWaitMin + '</b><span>最长等待(分)</span></div>' +
        '</div>' + legsHtml;
      box.appendChild(card);
    });
  </script>
  <script src="js/compare-table.js"></script>
  <script src="js/map-view.js"></script>
</body>
</html>
