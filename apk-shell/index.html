<!DOCTYPE html>
<!-- 结伴行 · Android WebView 壳首页（雷馨怡 · 2026-11-17）
     作用：常驻本地页面，创建全屏子 WebView 加载线上地址；
     返回键 / 断网重试逻辑写在这里，不会被线上页面覆盖。 -->
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
  <title>结伴行</title>
  <style>
    html, body { margin: 0; padding: 0; width: 100%; height: 100%;
                 background: #FFF6F0; font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; }
    #ld { position: fixed; inset: 0; display: flex; flex-direction: column;
          align-items: center; justify-content: center; }
    .logo { width: 96px; height: 96px; border-radius: 22px;
            background: linear-gradient(135deg, #FF8A3D, #FF5F33);
            display: flex; align-items: center; justify-content: center;
            box-shadow: 0 8px 24px rgba(255, 95, 51, .25); }
    .name { margin-top: 20px; font-size: 20px; font-weight: 600; color: #3B2E28; letter-spacing: 2px; }
    .bar { margin-top: 26px; width: 132px; height: 4px; border-radius: 2px; background: #FFE0D2; overflow: hidden; }
    .bar i { display: block; width: 46px; height: 4px; border-radius: 2px; background: #FF6A3D;
             animation: mv 1.1s ease-in-out infinite; }
    @keyframes mv { 0% { margin-left: -46px; } 100% { margin-left: 132px; } }
    .tip { margin-top: 14px; font-size: 13px; color: #A08776; }
    #err { display: none; position: fixed; inset: 0; background: #FFF6F0;
           flex-direction: column; align-items: center; justify-content: center; }
    #err .msg { margin: 18px 0 26px; font-size: 15px; color: #6B5A50; line-height: 1.7; text-align: center; padding: 0 40px; }
    #retry { padding: 12px 42px; border: none; border-radius: 24px;
             background: linear-gradient(135deg, #FF8A3D, #FF5F33); color: #fff; font-size: 16px; }
  </style>
</head>
<body>
  <div id="ld">
    <div class="logo"><svg width="58" height="58" viewBox="0 0 58 58">
      <path d="M10 18 C 22 12, 30 26, 43 20" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round"/>
      <path d="M10 29 C 24 26, 32 40, 44 35" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round" opacity=".85"/>
      <path d="M10 41 C 23 40, 30 50, 42 47" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round" opacity=".7"/>
      <circle cx="46" cy="29" r="7" fill="#fff"/>
      <circle cx="46" cy="29" r="3.2" fill="#FF5F33"/>
    </svg></div>
    <div class="name">结伴行</div>
    <div class="bar"><i></i></div>
    <div class="tip" id="tip">正在加载…</div>
  </div>

  <div id="err">
    <div class="logo"><svg width="58" height="58" viewBox="0 0 58 58">
      <path d="M29 14 v18" stroke="#fff" stroke-width="5" stroke-linecap="round"/>
      <circle cx="29" cy="42" r="3.5" fill="#fff"/>
    </svg></div>
    <div class="msg">页面加载失败，<br>请检查网络后重试</div>
    <button id="retry">重新加载</button>
  </div>

  <script>
  (function () {
    var APP_URL = "https://zhy-246-bd.github.io/jiebanxing/";
    var wv = null, backTapTime = 0;

    function tip(t) { var el = document.getElementById("tip"); if (el) el.textContent = t; }
    function showErr() {
      document.getElementById("ld").style.display = "none";
      document.getElementById("err").style.display = "flex";
    }

    function openRemote() {
      tip("正在加载…");
      wv = plus.webview.create(APP_URL, "remote", {
        top: "0px", bottom: "0px", bounce: "none"
      });
      wv.addEventListener("loaded", function () {
        // 首次 loaded 才显示，避免白屏闪烁
        wv.show("none");
        document.getElementById("ld").style.display = "none";
      });
      wv.addEventListener("error", function () { showErr(); });
      // 超时兜底：20 秒还没 loaded 就给重试入口
      setTimeout(function () {
        if (document.getElementById("ld").style.display !== "none") showErr();
      }, 20000);
    }

    document.getElementById("retry").addEventListener("click", function () {
      if (wv) { try { wv.close("none"); } catch (e) {} wv = null; }
      document.getElementById("err").style.display = "none";
      document.getElementById("ld").style.display = "flex";
      openRemote();
    });

    document.addEventListener("plusready", function () {
      openRemote();
      // 返回键：子页面能后退则后退，否则双击退出
      plus.key.addEventListener("backbutton", function () {
        if (!wv) { plus.runtime.quit(); return; }
        wv.canBack(function (e) {
          if (e && e.canBack) { wv.back(); return; }
          var now = Date.now();
          if (now - backTapTime < 2000) plus.runtime.quit();
          else {
            backTapTime = now;
            plus.nativeUI.toast("再按一次退出结伴行", { duration: "short" });
          }
        });
      });
    }, false);

    // 极端情况：plus 环境没起来（如直接用浏览器预览本文件），直接跳转
    setTimeout(function () {
      if (!window.plus) { location.href = APP_URL; }
    }, 2500);
  })();
  </script>
</body>
</html>
